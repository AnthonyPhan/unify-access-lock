name: doorstate

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: doorstate-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    environment:
      DOORSTATE_MQTT_USERNAME: ${DOORSTATE_MQTT_USERNAME:?Run ./setup-mqtt.sh first}
      DOORSTATE_MQTT_PASSWORD: ${DOORSTATE_MQTT_PASSWORD:?Run ./setup-mqtt.sh first}
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1 -p 1883
          -u "$${DOORSTATE_MQTT_USERNAME}"
          -P "$${DOORSTATE_MQTT_PASSWORD}"
          -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  doorstate:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${DOORSTATE_VERSION:-local}
        BUILD_ARCH: ${DOORSTATE_ARCH:-aarch64}
    image: local/doorstate:${DOORSTATE_VERSION:-local}
    container_name: doorstate
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /data/config.json
      PORT: "8080"
      SETUP_PORT: "8080"
      HOME_ASSISTANT_INGRESS: "false"
      HA_MQTT_ENABLED: "true"
      HA_MQTT_URL: mqtt://mosquitto:1883
      HA_MQTT_USERNAME: ${DOORSTATE_MQTT_USERNAME}
      HA_MQTT_PASSWORD: ${DOORSTATE_MQTT_PASSWORD}
      HA_MQTT_SOURCE: compose
      HA_MQTT_DISCOVERY_PREFIX: homeassistant
      HA_MQTT_TOPIC_PREFIX: doorstate
      TZ: ${TZ:-Australia/Perth}
    volumes:
      - doorstate_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/').then(response =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  doorstate_data:
